<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Verificador de nacionalidade</h1>
    Qual o seu país? <input type="text" name="txtn" id="txtn" />
    <input type="button" value="Verificar" onclick="verificarNacionalidade()" />
    <div id="res"></div>

    <script>
      var txtn = window.document.querySelector("input#txtn");
      var res = window.document.querySelector("div#res");

      function verificarNacionalidade() {
        if (txtn.value != "Brasil") {
          res.innerHTML = `<p>Você é <strong>ESTRANGEIRO</strong></p>`;
        } else {
          res.innerHTML = `<p>Você é <strong>BRASILEIRO</strong></p>`;
        }
      }
    </script>
  </body>
</html>
