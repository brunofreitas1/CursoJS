      </p>
    </div>
    <div id="res">
      <select id="txtanalise" size="6">
        
      </select>
      <p>
        <input type="button" onclick="finalizar()" value="Finalizar">
      </p>
      <div id="resf">
        
      </div>
    </div>
  </section>
  <footer>

  </footer>

</html>
